# Sobe 4 containers (4 "máquinas" de verdade, cada uma com sua própria pilha
# de rede) na mesma rede Docker, todas rodando o app de verdade em modo
# offscreen — serve só para confirmar que a malha (services/rede/redeService.py)
# realmente descobre as outras instâncias e sincroniza os pedidos entre elas.
#
# Uso (a partir da raiz do projeto):
#   docker compose -f docker/docker-compose.yml up --build
#
# Em outro terminal, simula alguém tirando um pedido na "maquina-a":
#   docker compose -f docker/docker-compose.yml exec maquina-a \
#       python3 docker/gerar_pedido_teste.py
#
# E confere se ele apareceu nas outras 3 (via volume montado no host, sem
# precisar entrar no container):
#   ls docker/pedidos/maquina-b docker/pedidos/maquina-c docker/pedidos/maquina-d
#
# Pra ver a lista de peers que cada "máquina" enxerga na malha:
#   docker compose -f docker/docker-compose.yml exec maquina-a \
#       python3 docker/listar_peers_teste.py
#
# Pra observar ao vivo a letra (A, B, C...) de RedeService.letraLocal
# reagindo a máquinas subindo/caindo (ver services/comandaSequencialService.py):
#   docker compose -f docker/docker-compose.yml run --rm --no-deps maquina-a \
#       python3 docker/malha_loop_teste.py

services:
  # As 4 "máquinas" usam a mesma imagem (buildada uma vez só, reaproveitada
  # pelas 4) — evita guardar 4 cópias idênticas de ~200MB no disco.
  maquina-a:
    image: pizzeria-malha-teste:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    hostname: maquina-a
    volumes:
      - ./pedidos/maquina-a:/app/pedidos
    networks:
      - malha-teste

  maquina-b:
    image: pizzeria-malha-teste:latest
    hostname: maquina-b
    volumes:
      - ./pedidos/maquina-b:/app/pedidos
    networks:
      - malha-teste
    depends_on:
      - maquina-a

  maquina-c:
    image: pizzeria-malha-teste:latest
    hostname: maquina-c
    volumes:
      - ./pedidos/maquina-c:/app/pedidos
    networks:
      - malha-teste
    depends_on:
      - maquina-a

  maquina-d:
    image: pizzeria-malha-teste:latest
    hostname: maquina-d
    volumes:
      - ./pedidos/maquina-d:/app/pedidos
    networks:
      - malha-teste
    depends_on:
      - maquina-a

networks:
  malha-teste:
    driver: bridge
