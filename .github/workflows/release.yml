# Publica uma release do Sistema de Pedidos quando se cria uma tag vX.Y.Z:
#   git tag -a v1.2.0 -m "O que mudou, em uma ou duas linhas" && git push origin v1.2.0
#
# Gera e publica: app-<tag>.zip, runtime-<hash>.zip, manifesto.json,
# manifesto.sig (assinado) e o instalador. As máquinas pegam o manifesto em
# .../releases/latest/download/ (ver launcher/bootstrap.py).
#
# Pré-requisitos (uma vez só):
#   - python scripts/assinar_release.py gerar-chaves  -> commitar
#     launcher/chave_publica.txt e guardar a privada no secret
#     PIZZARIA_CHAVE_ASSINATURA deste repositório.
#   - O repositório precisa ser PÚBLICO (ou o bootstrap ganhar um token), pois
#     as máquinas baixam sem autenticação.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Ferramentas
        run: python -m pip install cryptography packaging pyinstaller

      - name: Runtime embutido
        run: python launcher/montar_runtime.py --saida dist-runtime

      - name: Launcher (.exe)
        run: >
          python -m PyInstaller --onefile --noconsole --name SistemaDePedidos
          --distpath dist-exe --workpath launcher/build --specpath launcher/build
          launcher/iniciar.py

      - name: Pacote e assinatura
        shell: bash
        env:
          PIZZARIA_CHAVE_ASSINATURA: ${{ secrets.PIZZARIA_CHAVE_ASSINATURA }}
        run: |
          git fetch --tags --force
          NOTAS="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" | head -c 600)"
          python scripts/assinar_release.py empacotar --versao "${GITHUB_REF_NAME}" \
            --runtime dist-runtime --notas "${NOTAS}" --saida dist-release

      - name: Instalador
        shell: bash
        run: |
          python scripts/montar_instalacao.py --exe dist-exe/SistemaDePedidos.exe
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DVersao=${GITHUB_REF_NAME}" launcher/instalador.iss

      - name: Publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes \
            dist-release/manifesto.json dist-release/manifesto.sig dist-release/app-*.zip \
            dist-release/runtime-*.zip dist-instalador/Instalar-SistemaDePedidos.exe
